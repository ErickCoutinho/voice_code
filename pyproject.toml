[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-code"
version = "0.2.0"
description = "Modo ligação para o Claude Code: respostas lidas em voz alta e interrompíveis pela voz."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "edge-tts>=7.0",
    "numpy",
    "pillow>=12.0",
    "pystray>=0.19.5",
    "python-dotenv>=1.0",
    "sounddevice>=0.5",
    "soundfile>=0.13",
]

[project.optional-dependencies]
test = ["pytest>=8"]
build = ["pyinstaller==6.22.3"]

[tool.setuptools]
packages = ["voice_code"]

[tool.pytest.ini_options]
testpaths = ["tests"]
